<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>
  // Custom domain, e.g. "speed.example.com". When set, visitors who land on the production
  // *.pages.dev address are sent there, so every share link carries the custom domain.
  // Preview deployments (<hash>.<project>.pages.dev) are left alone.
  (function (host) {
    var h = location.hostname;
    if (host && h !== host && /^[^.]+\.pages\.dev$/.test(h)) location.replace('https://' + host + location.pathname + location.search + location.hash);
  })('');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测速地图</title>
<meta name="description" content="把 Speedtest 导出的 CSV 放到地图上，本机查看或生成分享链接。">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-view="landing">

<div id="map" aria-label="测速地点地图"></div>
<div class="veil" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><b class="halo"></b></div>

<!-- ───────────── Landing ───────────── -->
<section class="landing" id="landing">
  <div class="brand reveal" style="--d:0">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9h2.2A6.8 6.8 0 0 1 12 5.2 6.8 6.8 0 0 1 18.8 12H21a9 9 0 0 0-9-9Z"/><path d="m12.9 13.3 4.6-5.6-5.9 4.3a1.6 1.6 0 1 0 1.3 1.3Z"/></svg>
    <span>测速地图</span>
  </div>

  <h1 class="hero">
    <span class="reveal" style="--d:1">每一次测速，</span>
    <span class="reveal grad" style="--d:2">都落在地图上。</span>
  </h1>
  <p class="lede reveal" style="--d:3">把 Speedtest 导出的 CSV 拖进来。数据只在你的浏览器里解析——<br class="br">只有当你选择分享时，才会上传。</p>

  <label class="drop reveal" style="--d:4" id="drop">
    <input type="file" id="file" accept=".csv,text/csv" hidden>
    <span class="glow" aria-hidden="true"></span>
    <span class="drop-inner">
      <span class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 15.5V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 14.5v3A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg>
      </span>
      <span class="drop-title">拖入 CSV，或<u>点按选择文件</u></span>
      <span class="drop-hint">Speedtest App → 设置 → 导出测试结果</span>
    </span>
  </label>

  <button type="button" class="ghost reveal" style="--d:5" id="demo">没有文件？先看看示例 <span aria-hidden="true">→</span></button>

  <div class="loading" id="loading" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p id="loadingText">正在载入共享的测速地图…</p>
  </div>
</section>

<!-- ───────────── Sheet (choice / sharing / done / error) ───────────── -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <span class="glow" aria-hidden="true"></span>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- ───────────── Dashboard ───────────── -->
<section class="dash" id="dash" aria-hidden="true">
  <header class="topbar">
    <div class="title glass">
      <button type="button" class="home" id="home" aria-label="回到首页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9h2.2A6.8 6.8 0 0 1 12 5.2 6.8 6.8 0 0 1 18.8 12H21a9 9 0 0 0-9-9Z"/><path d="m12.9 13.3 4.6-5.6-5.9 4.3a1.6 1.6 0 1 0 1.3 1.3Z"/></svg>
      </button>
      <div class="title-text">
        <b id="dashTitle">测速地图</b>
        <span id="dashSub"></span>
      </div>
    </div>

    <div class="seg glass" id="metric" role="tablist" aria-label="地图按什么上色">
      <span class="seg-pill" aria-hidden="true"></span>
      <button type="button" role="tab" data-m="dl" aria-selected="true">下载</button>
      <button type="button" role="tab" data-m="ul" aria-selected="false">上传</button>
      <button type="button" role="tab" data-m="ping" aria-selected="false">延迟</button>
    </div>

    <div class="actions" id="actions"></div>
  </header>

  <aside class="panel glass" id="panel">
    <button type="button" class="handle" id="handle" aria-label="展开面板"><i></i></button>
    <div class="kpi-hero">
      <span class="kpi-label" id="heroLabel">下载中位数</span>
      <div class="kpi-big"><b class="num" id="heroVal">0</b><small id="heroUnit">Mbps</small></div>
    </div>
    <div class="kpis" id="kpis"></div>

    <div class="tabs" id="tabs" role="tablist" aria-label="视图">
      <span class="tabs-pill" aria-hidden="true"></span>
      <button type="button" role="tab" data-tab="overview" aria-selected="true">概览</button>
      <button type="button" role="tab" data-tab="timeline" aria-selected="false">时间线</button>
    </div>

    <div class="group">
      <h2>网络</h2>
      <div class="chips" id="types"></div>
    </div>

    <div id="ov">
      <div class="group">
        <h2>年份</h2>
        <div class="chips" id="years"></div>
      </div>

      <div class="group">
        <h2>按网络类型 · 中位数</h2>
        <div class="bars" id="netBars"></div>
      </div>

      <div class="group">
        <h2>按城市 · 中位数</h2>
        <ol class="cities" id="cities"></ol>
      </div>
    </div>

    <div id="tl" hidden></div>

    <p class="foot" id="foot"></p>
  </aside>

  <div class="legend glass" id="legend"></div>

  <div class="zoom glass">
    <button type="button" id="zin" aria-label="放大">+</button>
    <button type="button" id="zout" aria-label="缩小">−</button>
    <button type="button" id="zall" aria-label="显示全部地点">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.6 5.4 3.6 8.5s-1 6.1-3.6 8.5c-2.6-2.4-3.6-5.4-3.6-8.5S9.4 5.9 12 3.5Z"/></svg>
    </button>
  </div>

  <div class="playchip glass" id="playChip" aria-live="polite"><span id="pcDate"></span><b id="pcCity"></b></div>

  <article class="detail glass" id="detail" aria-live="polite"></article>
</section>

<div class="tip glass" id="tip" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="/cities.js"></script>
<script src="/app.js"></script>
</body>
</html>
