<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>
  // Custom domain, e.g. "speed.example.com". When set, visitors who land on the production
  // *.pages.dev address are sent there, so every share link carries the custom domain.
  // Preview deployments (<hash>.<project>.pages.dev) are left alone.
  (function (host) {
    var h = location.hostname;
    if (host && h !== host && /^[^.]+\.pages\.dev$/.test(h)) location.replace('https://' + host + location.pathname + location.search + location.hash);
  })('speed.niantic.club');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app">测速地图</title>
<meta name="description" content="把 Speedtest 导出的 CSV 放到地图上，本机查看或生成分享链接。" data-i18n-attr="content:metaDesc">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-view="landing">

<canvas id="stars" aria-hidden="true"></canvas>
<div id="map" data-i18n-attr="aria-label:mapLabel"></div>
<div class="veil" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><b class="halo"></b></div>

<!-- ───────────── Landing ───────────── -->
<section class="landing" id="landing">
  <div class="brand reveal" style="--d:0">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9h2.2A6.8 6.8 0 0 1 12 5.2 6.8 6.8 0 0 1 18.8 12H21a9 9 0 0 0-9-9Z"/><path d="m12.9 13.3 4.6-5.6-5.9 4.3a1.6 1.6 0 1 0 1.3 1.3Z"/></svg>
    <span data-i18n="app"></span>
  </div>

  <h1 class="hero"><span class="reveal grad" style="--d:1" data-i18n="app"></span></h1>

  <label class="drop reveal" style="--d:4" id="drop">
    <input type="file" id="file" accept=".csv,text/csv" hidden>
    <span class="glow" aria-hidden="true"></span>
    <span class="drop-inner">
      <span class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 15.5V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 14.5v3A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg>
      </span>
      <span class="drop-title" data-i18n-html="dropTitle"></span>
      <span class="drop-hint" data-i18n="dropHint"></span>
    </span>
  </label>

  <div class="ghost-row reveal" style="--d:5">
    <button type="button" class="ghost" id="help" data-i18n="helpBtn"></button>
    <button type="button" class="ghost" id="demo"><b data-i18n="demoBtn"></b> <span aria-hidden="true">→</span></button>
  </div>

  <footer class="site-foot reveal" style="--d:6">
    <a href="https://github.com/vhu231/speedtest-map" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      GitHub
    </a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/vhu231/speedtest-map/blob/main/LICENSE" target="_blank" rel="noopener" data-i18n="license"></a>
    <span aria-hidden="true">·</span>
    <button type="button" id="privacy" data-i18n="privacy"></button>
    <span class="lang-sep" aria-hidden="true">·</span>
    <span class="lang" data-lang-switch></span>
  </footer>

  <div class="loading" id="loading" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p id="loadingText"></p>
  </div>
</section>

<!-- ───────────── Sheet (choice / sharing / done / error) ───────────── -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <span class="glow" aria-hidden="true"></span>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- ───────────── Dashboard ───────────── -->
<section class="dash" id="dash" aria-hidden="true">
  <header class="topbar">
    <div class="title glass">
      <button type="button" class="home" id="home" data-i18n-attr="aria-label:home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9h2.2A6.8 6.8 0 0 1 12 5.2 6.8 6.8 0 0 1 18.8 12H21a9 9 0 0 0-9-9Z"/><path d="m12.9 13.3 4.6-5.6-5.9 4.3a1.6 1.6 0 1 0 1.3 1.3Z"/></svg>
      </button>
      <div class="title-text">
        <b id="dashTitle"></b>
        <span id="dashSub"></span>
      </div>
    </div>

    <div class="seg glass" id="metric" role="tablist" data-i18n-attr="aria-label:metricAria">
      <span class="seg-pill" aria-hidden="true"></span>
      <button type="button" role="tab" data-m="dl" aria-selected="true" data-i18n="m.dl"></button>
      <button type="button" role="tab" data-m="ul" aria-selected="false" data-i18n="m.ul"></button>
      <button type="button" role="tab" data-m="ping" aria-selected="false" data-i18n="m.ping"></button>
    </div>

    <div class="actions" id="actions"></div>
  </header>

  <aside class="panel glass" id="panel">
    <button type="button" class="handle" id="handle" data-i18n-attr="aria-label:expandPanel"><i></i></button>
    <div class="kpi-hero">
      <span class="kpi-label" id="heroLabel"></span>
      <div class="kpi-big"><b class="num" id="heroVal">0</b><small id="heroUnit">Mbps</small></div>
    </div>
    <div class="kpis" id="kpis"></div>

    <div class="tabs" id="tabs" role="tablist" data-i18n-attr="aria-label:viewsAria">
      <span class="tabs-pill" aria-hidden="true"></span>
      <button type="button" role="tab" data-tab="overview" aria-selected="true" data-i18n="overview"></button>
      <button type="button" role="tab" data-tab="timeline" aria-selected="false" data-i18n="timeline"></button>
    </div>

    <div class="group">
      <h2 data-i18n="network"></h2>
      <div class="chips" id="types"></div>
    </div>

    <div id="ov">
      <div class="group">
        <h2 data-i18n="years"></h2>
        <div class="chips" id="years"></div>
      </div>

      <div class="group">
        <h2 data-i18n="byType"></h2>
        <div class="bars" id="netBars"></div>
      </div>

      <div class="group">
        <h2 data-i18n="byCity"></h2>
        <ol class="cities" id="cities"></ol>
      </div>
    </div>

    <div id="tl" hidden></div>

    <p class="foot" id="foot"></p>
    <p class="foot links"><a href="https://github.com/vhu231/speedtest-map" target="_blank" rel="noopener">GitHub</a> · <a href="https://github.com/vhu231/speedtest-map/blob/main/LICENSE" target="_blank" rel="noopener" data-i18n="license"></a> · <button type="button" data-help="privacy" data-i18n="privacy"></button> · <span class="lang" data-lang-switch></span></p>
  </aside>

  <div class="legend glass" id="legend"></div>

  <div class="zoom glass">
    <button type="button" id="zin" data-i18n-attr="aria-label:zoomIn;title:zoomIn">+</button>
    <button type="button" id="zout" data-i18n-attr="aria-label:zoomOut;title:zoomOut">−</button>
    <button type="button" id="zall" data-i18n-attr="aria-label:showAll;title:showAll">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.6 5.4 3.6 8.5s-1 6.1-3.6 8.5c-2.6-2.4-3.6-5.4-3.6-8.5S9.4 5.9 12 3.5Z"/></svg>
    </button>
  </div>

  <div class="playchip glass" id="playChip" aria-live="polite"><span id="pcDate"></span><b id="pcCity"></b></div>

  <article class="detail glass" id="detail" aria-live="polite"></article>
</section>

<div class="tip glass" id="tip" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="/cities.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
